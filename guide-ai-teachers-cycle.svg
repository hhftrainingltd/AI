<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">AI guide for teachers and education teams learning cycle</title>
  <desc id="desc">A premium visual showing how learning moves from discovery to daily implementation and improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.56" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#F4F7FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00296B"/>
      <stop offset="0.55" stop-color="#5AC7B5"/>
      <stop offset="1" stop-color="#00296B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#25354A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="860" rx="54" fill="url(#bg)"/>
